<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Tool Stock</title>
<meta name="theme-color" content="#0d0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Stock">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e0f; --panel: #151719; --panel2: #1c1f22; --line: #2a2e33; --line2: #3a3f45;
    --text: #ecebe7; --muted: #8d9196; --faint: #5f6368;
    --accent: #2f4b70; --accent-2: #40618f; --accent-hi: #8ea9cf; --on-accent: #eaf0f8;
    --in: #3d6fd6; --in-2: #5a87e3; --on-in: #f3f6ff;            /* เข้าสต็อก = น้ำเงิน */
    --out: #d97757; --out-2: #e48d70; --on-out: #1f100a;         /* ออกจากสต็อก = ส้ม */
    --ok: #4fd18b; --warn: #ffc53d; --err: #ff5a5a; --flag: #ff4d4d; --done: #179a55;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Thai', system-ui, sans-serif;
    --gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { touch-action: manipulation; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans);
               -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; justify-content: center; }
  [hidden] { display: none !important; }

  .app { width: 100%; max-width: 480px; min-height: 100vh; min-height: 100dvh;
         display: flex; flex-direction: column; gap: 14px;
         padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  .top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 14px;
         border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  .top .id { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--muted);
             text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .id b { color: var(--text); font-weight: 400; }
  .top .acts { display: flex; gap: 16px; flex: none; }
  .sync { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 8px; vertical-align: 1px;
          background: var(--ok); opacity: .55; transition: background .2s, opacity .2s; cursor: pointer; }
  body[data-sync=busy] .sync { background: var(--accent-hi); opacity: 1; animation: blink 1s ease-in-out infinite; }
  body[data-sync=pending] .sync { background: var(--warn); opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  .top button { background: none; border: 0; color: var(--muted); font-family: var(--sans); font-size: 15px;
                cursor: pointer; padding: 9px 2px; margin: -9px -2px; }
  .top button:hover { color: var(--text); }

  .head { flex: none; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .clock { font-family: var(--mono); font-size: clamp(44px, 13vw, 58px); line-height: .9; white-space: nowrap; }
  .clock small { font-size: .38em; color: var(--muted); }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; min-width: 0; }
  .date { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1px solid var(--line);
            border-radius: 999px; font-size: 14px; white-space: nowrap; background: none; color: var(--text); font-family: var(--sans); cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(79,209,139,.18); }
  .status.low .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,197,61,.18); }
  .status.out .dot { background: var(--flag); box-shadow: 0 0 0 3px rgba(255,77,77,.2); }

  .label { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
           font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .label > span:first-child { color: var(--text); font-weight: 500; white-space: nowrap; font-size: 16px; }
  .hrs { font-family: var(--mono); font-size: 14px; letter-spacing: .04em; white-space: nowrap; }
  .hrs b { color: var(--text); font-weight: 400; }

  /* ---------- ค้นหา / สแกน ---------- */
  .finder { position: relative; flex: none; }
  .search { display: flex; align-items: center; gap: 0; background: var(--panel); border: 1px solid var(--line);
            border-radius: 12px; padding-left: 14px; }
  .search:focus-within { border-color: var(--accent-hi); }
  .search svg.mg { flex: none; width: 18px; height: 18px; color: var(--faint); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit;
                  font-size: 17px; height: 50px; padding: 0 10px; }
  .search input::placeholder { color: var(--faint); }
  .cam { flex: none; height: 50px; width: 56px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text);
         cursor: pointer; display: grid; place-items: center; border-radius: 0 12px 12px 0; }
  .cam svg { width: 24px; height: 24px; }
  .cam:active { background: var(--line); }
  .tsugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; border: 1px solid var(--line2);
           border-radius: 12px; background: var(--panel2); overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .tsugg.inline { position: static; margin-top: 6px; box-shadow: none; }
  .tsugg button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 14px;
                  border: 0; background: none; color: var(--text); font: inherit; cursor: pointer; }
  .tsugg button + button { border-top: 1px solid var(--line); }
  .tsugg button:active, .tsugg button.sel { background: var(--line); }
  .tsugg b { font-weight: 500; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tsugg small { grid-column: 1; font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tsugg .q { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font-family: var(--mono); font-size: 20px; }
  .tsugg .q i { display: block; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .tsugg mark { background: none; color: var(--accent-hi); }
  .tsugg .none { padding: 12px 14px; color: var(--muted); font-size: 15px; }
  .q.low { color: var(--warn); } .q.out { color: var(--flag); }

  .notfound { margin-top: 8px; border: 1px solid rgba(255,197,61,.5); background: rgba(255,197,61,.08); border-radius: 12px;
              padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; }
  .notfound b { font-family: var(--mono); font-weight: 400; color: var(--warn); }
  .notfound .btn { padding: 8px 14px; font-size: 15px; white-space: nowrap; }

  /* ---------- ปุ่มรายการ: 2 คอลัมน์ 4 แถว (เข้าสต็อก | ออกจากสต็อก) ---------- */
  .grid { display: grid; gap: var(--gap); grid-template-columns: 1fr 1fr;
          grid-template-rows: 104px 68px 68px 68px; }
  .tile { position: relative; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 11px 14px; text-align: left; color: var(--text); font: inherit; cursor: pointer;
          display: flex; flex-direction: column; justify-content: flex-start; gap: 3px; overflow: hidden;
          transition: border-color .15s, background .15s, transform .05s; -webkit-tap-highlight-color: transparent;
          touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile:active { transform: scale(.97); }
  .tile .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
  .tile .th { font-size: 17px; font-weight: 600; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tile .en { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); white-space: nowrap;
              min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tile.sm { container-type: inline-size; flex-direction: row; align-items: center; justify-content: space-between; }
  .tile.sm .lab { flex-direction: column; align-items: flex-start; gap: 0; }
  @container (max-width: 150px) { .tile.sm .lab .en { display: none; } }
  .tile.big .lab { flex-direction: column; align-items: flex-start; gap: 2px; }
  .tile.big .th { font-size: 21px; }
  .tile.big .en { font-size: 13px; order: -1; }
  .tile .t { font-family: var(--mono); font-size: 26px; line-height: 1; color: var(--faint); white-space: nowrap; }
  .tile.big .t { margin-top: auto; font-size: 34px; }
  .tile .t small { font-size: 12px; letter-spacing: .06em; margin-left: 4px; }
  .tile.done .t { color: var(--text); }
  .tile.big.in  { background: var(--in);  border-color: var(--in-2);  color: var(--on-in); }
  .tile.big.out { background: var(--out); border-color: var(--out-2); color: var(--on-out); }
  .tile.big .en, .tile.big .t { color: inherit; opacity: .78; }
  .tile.sm.in  { border-left: 3px solid var(--in); }
  .tile.sm.out { border-left: 3px solid var(--out); }
  .tile.sm.neu { border-left: 3px solid var(--accent-hi); }

  /* ---------- รายการล่าสุด ---------- */
  .recent { flex: 1 1 auto; min-height: 0; }
  .rlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
  .ritem { display: grid; grid-template-columns: 74px 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; }
  .ritem + .ritem { border-top: 1px solid var(--line); }
  .ritem .rt { grid-row: 1 / span 2; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); line-height: 1.25; }
  .ritem .rt::before { content: ''; display: block; width: 18px; height: 3px; border-radius: 2px; margin-bottom: 5px; background: var(--muted); }
  .ritem.in .rt::before { background: var(--in); } .ritem.out .rt::before { background: var(--out); } .ritem.neu .rt::before { background: var(--accent-hi); }
  .ritem b { font-weight: 500; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ritem small { grid-column: 2; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ritem .rq { grid-column: 3; grid-row: 1; text-align: right; font-family: var(--mono); font-size: 19px; }
  .ritem .rtime { grid-column: 3; grid-row: 2; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ritem.pending .rtime { color: var(--warn); }
  .rempty { padding: 18px 14px; color: var(--muted); font-size: 15px; text-align: center; }

  /* ---------- shared form bits ---------- */
  .btn { padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: transparent;
         color: var(--text); font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  .btn.solid { background: var(--accent); border-color: var(--accent-2); color: var(--on-accent); }
  .btn.solid.in  { background: var(--in);  border-color: var(--in-2);  color: var(--on-in); }
  .btn.solid.out { background: var(--out); border-color: var(--out-2); color: var(--on-out); }
  .btn.armed { background: #2a2412 !important; border-color: var(--warn) !important; color: var(--warn) !important; }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { width: 100%; height: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
           color: var(--text); font: inherit; font-size: 18px; padding: 0 14px; outline: 0; }
  select.field { appearance: none; -webkit-appearance: none; padding-right: 34px;
                 background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
                 background-position: calc(100% - 18px) 23px, calc(100% - 13px) 23px; background-size: 5px 5px; background-repeat: no-repeat; }
  .field:focus { border-color: var(--accent-hi); }
  .field::placeholder { color: var(--faint); }
  .field.bad { border-color: var(--err); }
  .cap { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 8px; }
  .cap em { font-style: normal; color: var(--err); }

  /* ---------- login ---------- */
  .login { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; align-items: center; justify-content: center;
           padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow: auto; }
  .login form { width: 100%; max-width: 420px; }
  .login .brand { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; color: var(--muted);
                  border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .login .clock { margin: 22px 0 6px; }
  .login .ldate { font-size: 15px; }
  .login h1 { font-size: 24px; font-weight: 600; margin: 24px 0 4px; }
  .login p { color: var(--muted); font-size: 15px; }
  .login .btn { width: 100%; margin-top: 20px; height: 54px; }
  .login .msg { min-height: 22px; margin-top: 12px; font-size: 15px; color: var(--err); }

  /* ---------- popup ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(0,0,0,.62);
           -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
           padding: calc(max(12px, env(safe-area-inset-top)) + 6px) 12px max(12px, env(safe-area-inset-bottom)); }
  .modal.show { display: flex; justify-content: center; align-items: flex-start; }
  .sheet { width: 100%; max-width: 456px; max-height: 100%; overflow: auto; background: var(--panel);
           border: 1px solid var(--line2); border-radius: 18px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;
           animation: pop .16s ease-out; }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } }
  .sheet .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); }
  .sheet h3 { font-size: 22px; font-weight: 600; margin-top: 2px; line-height: 1.25; }
  .sheet .actions { display: flex; gap: 10px; position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 12px 16px 16px;
                    background: var(--panel); border-top: 1px solid var(--line); z-index: 2; }
  .sheet .actions .btn { flex: 1; height: 56px; }
  .sheet .actions .btn.solid { flex: 1.6; }

  .seg { display: flex; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; min-height: 46px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 16px; cursor: pointer; padding: 6px 8px; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--text); color: #111; font-weight: 600; }
  .seg.sm button { min-height: 38px; font-size: 14px; }

  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--panel2); }
  .item.warn { border-color: rgba(255,197,61,.6); }
  .ih { display: flex; gap: 10px; align-items: flex-start; }
  .ih .in { flex: 1; min-width: 0; }
  .ih b { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .ih small { display: block; font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted);
       font-size: 20px; cursor: pointer; }
  .istock { font-size: 14px; color: var(--muted); }
  .istock b { font-family: var(--mono); font-weight: 400; color: var(--text); font-size: 16px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty .field { width: 84px; height: 48px; text-align: right; font-family: var(--mono); font-size: 22px; padding: 0 10px; }
  .qty span { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .qty .eq { margin-left: auto; font-family: var(--mono); font-size: 20px; color: var(--text); }
  .iwarn { font-size: 14px; color: var(--warn); font-weight: 600; }
  .iwarn:empty { display: none; }
  .empty { border: 1px dashed var(--line2); border-radius: 14px; padding: 18px 14px; color: var(--muted); font-size: 15px; text-align: center; line-height: 1.5; }
  .ptotal { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--muted); }
  .ptotal b { font-family: var(--mono); font-size: 24px; font-weight: 400; color: var(--text); }
  .pmsg { font-size: 15px; color: var(--err); }
  .pmsg:empty { display: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .cap { margin-top: 0; }
  .sugg { margin-top: 6px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel2); overflow: hidden; }
  .sugg button { display: block; width: 100%; text-align: left; height: 44px; padding: 0 14px; border: 0; background: none;
                 color: var(--text); font-family: var(--mono); font-size: 17px; cursor: pointer; }
  .sugg button + button { border-top: 1px solid var(--line); }
  .sugg mark { background: none; color: var(--accent-hi); }

  /* ---------- ฟอร์มลงทะเบียน ---------- */
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .fgrid .full { grid-column: 1 / -1; }
  .fgrid .cap { margin: 12px 0 6px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fgrid .field { height: 48px; font-size: 17px; }
  .fsec { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }

  /* ---------- รายละเอียดทูล ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--panel2); min-width: 0; }
  .stat i { display: block; font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font-family: var(--mono); font-weight: 400; font-size: 26px; line-height: 1.1; }
  .stat.main { border-color: var(--line2); }
  .stat.main.low b { color: var(--warn); } .stat.main.out b { color: var(--flag); }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; font-size: 14px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .chip.st-OK { border-color: rgba(79,209,139,.5); color: var(--ok); } .chip.st-LOW { border-color: rgba(255,197,61,.6); color: var(--warn); }
  .chip.st-OUT { border-color: rgba(255,77,77,.6); color: var(--flag); }
  .actgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actgrid .btn { font-size: 15px; padding: 10px; border-left-width: 3px; text-align: left; }
  .actgrid .btn.in { border-left-color: var(--in); } .actgrid .btn.out { border-left-color: var(--out); } .actgrid .btn.neu { border-left-color: var(--accent-hi); }
  .llist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .llist button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border: 0; background: none; color: var(--text);
                  font: inherit; text-align: left; cursor: pointer; }
  .llist button + button { border-top: 1px solid var(--line); }
  .llist b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .llist small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .llist .q { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-family: var(--mono); font-size: 20px; text-align: right; }

  /* ---------- สแกนบาร์โค้ด ---------- */
  .scan { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .scan video { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #000; }
  .scanframe { position: absolute; left: 50%; top: 38%; width: min(78vw, 360px); height: min(36vw, 170px); transform: translate(-50%, -50%);
               border: 2px solid rgba(255,255,255,.85); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38); pointer-events: none; }
  .scanframe::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: var(--out); opacity: .9;
                      animation: scanline 1.6s ease-in-out infinite; }
  @keyframes scanline { 0%,100% { transform: translateY(-34px); } 50% { transform: translateY(34px); } }

    if (m) cat.stock.keys.forEach(function (k, i) { s[k] = m[i]; });
    ['ohn', 'ohu', 'atrg', 'tot', 'value', 'min'].forEach(function (k) { s[k] = n0(s[k]); });
    var d = pend[id], pb = pcsBox(id);
    if (d) { s.ohn += d.n; s.ohu += d.u; s.atrg += d.rg; s.tot = s.ohn + s.ohu; s.pending = true; }
    if (!m || d) {

  /* ================== ค้นหา ================== */
  function findByCode(code) {
    code = String(code || '').trim();
    if (!code) return null;
    if (byId[code]) return byId[code];
    var n = code.replace(/\s+/g, '').toUpperCase(), nz = n.replace(/^0+(?=\d)/, '');
    var alnum = function (s) { return String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, ''); };
    for (var i = 0; i < tools.length; i++) { var id = tools[i].id.toUpperCase(); if (id === n || id.replace(/^0+(?=\d)/, '') === nz) return tools[i]; }
    for (var j = 0; j < tools.length; j++) if (tools[j].pn && alnum(tools[j].pn) === alnum(code)) return tools[j];
    return null;
  }
  function searchTools(q, limit) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    var toks = q.split(/\s+/);
    var out = [];
    tools.forEach(function (t) {
      var ok = toks.every(function (k) { return t.blob.indexOf(k) >= 0 || (/^[øød]?\d+(\.\d+)?$/.test(k) && num(t.d1) === k.replace(/^[øød]/, '')); });
      if (!ok) return;
      var sc = t.id.toLowerCase() === q ? 100 : String(t.pn || '').toLowerCase() === q ? 90 : t.id.toLowerCase().indexOf(q) === 0 ? 50 : String(t.desc || '').toLowerCase().indexOf(toks[0]) === 0 ? 20 : 0;
      out.push({ t: t, sc: sc });
    });
    out.sort(function (a, b) { return b.sc - a.sc || String(a.t.desc).localeCompare(String(b.t.desc)); });
    return out.slice(0, limit || 8).map(function (x) { return x.t; });
  }
  function hl(text, q) {
    text = String(text || '');
    var k = String(q || '').trim().toLowerCase().split(/\s+/)[0], i = k ? text.toLowerCase().indexOf(k) : -1;
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + k.length)) + '</mark>' + esc(text.slice(i + k.length));
  }
  function specLine(t) {
    var p = [];
    function add(pre, v, post) { v = num(v); if (v !== '' && v !== '0') p.push((pre || '') + v + (post || '')); }
    function txt(v) { if (v) p.push(v); }
    switch (t.cat) {
      case 'End Mill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.z, 'F'); add('R', t.r); txt(t.coat); break;
      case 'Drill': add('Ø', t.d1); add('Lc', t.lc); add('L', t.oal); add('', t.ang, '°'); txt(t.coat); break;
      case 'Reamer': add('Ø', t.d1); txt(t.tol); add('L', t.oal); break;
      case 'Tap': txt(t.thread); txt(t.taptype); txt(t.tol); break;
      case 'Step Drill': add('Ø', t.d1); add('Ø', t.d2); add('', t.ang, '°'); break;
      case 'Chamfer Tool': add('Ø', t.d1); add('', t.ang, '°'); break;
      case 'Carbide Insert': txt(t.isocode ? t.isocode + (t.cb ? '-' + t.cb : '') : ''); add('R', t.r); txt(t.grade); add('', t.corners, ' มุม'); break;
      case 'Tool Holder': txt(t.intf); txt(t.clamp); txt(t.crange); add('GL', t.gl); break;
      case 'Lathe Holder': txt(t.intf); txt(t.hand); txt(t.fit); break;
      case 'Grinding Wheel': txt(t.wsize); txt(t.wspec); break;
      default: add('Ø', t.d1); add('L', t.oal);
    }
    return p.join(' · ');
  }
  function qtyCls(s) { return s.status === 'OUT' ? 'out' : s.status === 'LOW' ? 'low' : ''; }

  /** dropdown รายการทูล (ใช้ทั้งหน้าหลักและในหน้าต่างบันทึก) */
  function toolSuggest(input, box, onPick) {
    var sel = -1, items = [];
    function hide() { box.hidden = true; box.innerHTML = ''; sel = -1; }
    function update() {
      var q = input.value.trim();

      box.innerHTML = items.map(function (t, i) {

        return '<button type="button" data-i="' + i + '"><b>' + hl(t.desc || t.id, q) + '</b><span class="q ' + qtyCls(s) + '">' + fmtQ(s.tot) + '<i>' + esc(t.unit || 'pcs') + '</i></span><small>' + hl(t.id, q) + (specLine(t) ? ' · ' + esc(specLine(t)) : '') + '</small></button>';

                             cancel: function () { openTx(typeKey, keep); } });
      });
    }
    var ts = toolSuggest(tq, wrap.querySelector('.tsg'), addTool);
    tq.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var code = tq.value.trim();
      if (!code) return;
      var t = findByCode(code) || (searchTools(code, 2).length === 1 ? searchTools(code, 1)[0] : null);
      tq.value = ''; ts.hide();
      if (t) addTool(t); else onCode(code);
    });
    wrap.querySelector('.tcam').addEventListener('click', function () { openScanner(onCode); });

    function itemWarn(it) {
      var s = stockOf(it.id), q = n0(it.pcs) + n0(it.box) * pcsBox(it.id);
      var type = typeKey === 'Adjust' ? (draft.adj === '-' ? 'Adjust (-)' : 'Adjust (+)') : typeKey;
      if (signOf(type) < 0) {
        var have = it.cond === 'New' ? s.ohn : s.ohu;
        if (q > have) return 'สต็อก ' + (it.cond === 'New' ? 'New' : 'Used/Regrind') + ' มี ' + fmtQ(have) + ' — ยอดจะติดลบ';
      }
      if (type === 'Regrind In' && q > s.atrg) return 'ที่ร้านรีกรายด์มี ' + fmtQ(s.atrg) + ' ชิ้น';
      return '';
    }
    function paint() {
      disarm();
      itemsEl.innerHTML = '';
      if (!draft.items.length) itemsEl.innerHTML = '<div class="empty">สแกนบาร์โค้ดบนกล่อง หรือพิมพ์ค้นหาทูล<br>เพื่อเพิ่มรายการ (เพิ่มได้หลายรายการ)</div>';
      draft.items.forEach(function (it, idx) {
        var t = byId[it.id] || { id: it.id, desc: it.id }, s = stockOf(it.id), pb = pcsBox(it.id);
        var el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<div class="ih"><div class="in"><b>' + esc(t.desc || t.id) + '</b><small>' + esc([t.id, specLine(t), t.loc].filter(Boolean).join(' · ')) + '</small></div><button type="button" class="x" aria-label="ลบ">×</button></div>' +
          '<div class="istock">คงเหลือ New <b>' + fmtQ(s.ohn) + '</b> · Used <b>' + fmtQ(s.ohu) + '</b>' + (s.atrg ? ' · ที่ร้านรีกรายด์ <b>' + fmtQ(s.atrg) + '</b>' : '') + (s.ohbox ? ' · ' + esc(boxTxt(s.ohbox)) : '') + '</div>' +
          (meta.pick ? '<div class="seg sm cond"><button type="button" data-c="New">ของใหม่ (New)</button><button type="button" data-c="Used/Regrind">ใช้แล้ว / รีกรายด์</button></div>' : '') +
          '<div class="qty"><input class="field pcs" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"><span>ชิ้น</span>' +
          (pb ? '<input class="field box" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"><span>กล่อง ×' + pb + '</span>' : '') +
          '<span class="eq"></span></div><div class="iwarn"></div>';
        var pcs = el.querySelector('.pcs'), box = el.querySelector('.box');
        pcs.value = it.pcs === '' || it.pcs == null ? '' : it.pcs;
        if (box) box.value = it.box === '' || it.box == null ? '' : it.box;
        function upd() {
          it.pcs = pcs.value.replace(/[^\d]/g, ''); pcs.value = it.pcs;
          if (box) { it.box = box.value.replace(/[^\d]/g, ''); box.value = it.box; }
          var q = n0(it.pcs) + n0(it.box) * pb;
          el.querySelector('.eq').textContent = pb ? '= ' + fmtQ(q) : '';
          var w = itemWarn(it);
          el.querySelector('.iwarn').textContent = w ? '⚠ ' + w : '';
          el.classList.toggle('warn', !!w);
          totals(); disarm();
        }
        pcs.addEventListener('input', upd);
        if (box) box.addEventListener('input', upd);
        [pcs, box].forEach(function (inp) { if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } }); });
        var cs = el.querySelector('.cond');
        if (cs) {
          $$('button', cs).forEach(function (b) { b.classList.toggle('on', b.dataset.c === it.cond); });
          cs.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; it.cond = b.dataset.c; $$('button', cs).forEach(function (x) { x.classList.toggle('on', x === b); }); upd(); });
        }
        el.querySelector('.x').addEventListener('click', function () { draft.items.splice(idx, 1); paint(); });
        itemsEl.appendChild(el);
        upd();
      });
      totals();
    }
    function totals() {
      var n = 0, q = 0;
      draft.items.forEach(function (it) { var x = n0(it.pcs) + n0(it.box) * pcsBox(it.id); if (x > 0) { n++; q += x; } });
      wrap.querySelector('.cnt').textContent = n + ' รายการ';
      wrap.querySelector('.tot').textContent = fmtQ(q);
      wrap.querySelector('.pmsg').textContent = '';
      setOk(n ? 'บันทึก' + meta.th.replace(/ \/.*$/, '') + ' ' + n + ' รายการ' : 'บันทึก', false);
    }
    function disarm() { armed = false; clearTimeout(armT); $('#mOk').classList.remove('armed'); }
    function collectMeta() { draft.machine = mc ? mc.value.trim() : ''; draft.job = job ? job.value.trim() : ''; draft.remark = rmk.value.trim(); }

    openModal({
      kicker: meta.en + ' · ' + meta.hint, title: meta.th, tone: meta.tone, body: wrap,
      onOk: function () {
        collectMeta();
        var items = draft.items.filter(function (it) { return n0(it.pcs) + n0(it.box) > 0; });
        if (!items.length) { wrap.querySelector('.pmsg').textContent = draft.items.length ? 'ใส่จำนวนอย่างน้อย 1 รายการ' : 'ยังไม่มีรายการ — สแกนหรือค้นหาทูลก่อน'; return; }
        if ((typeKey === 'Adjust' || typeKey === 'Scrap') && !draft.remark) { rmk.classList.add('bad'); rmk.focus(); wrap.querySelector('.pmsg').textContent = 'ใส่เหตุผลในช่องหมายเหตุ'; return; }
        var warn = items.some(function (it) { return itemWarn(it); });
        if (warn && !armed) {
          armed = true; $('#mOk').classList.add('armed'); $('#mOk').textContent = 'ยอดไม่พอ · แตะอีกครั้ง';
          clearTimeout(armT); armT = setTimeout(function () { disarm(); totals(); }, 4000);
          return;
        }
        doTx(typeKey, draft, items, warn);
      }
    });
    rmk.addEventListener('input', function () { rmk.classList.remove('bad'); });
    paint();
    if (!draft.items.length) setTimeout(function () { if (!('ontouchstart' in window)) tq.focus(); }, 60);
  }

  function doTx(typeKey, draft, items, warn) {
    var meta = TYPES[typeKey], hm = nowHM();
    var type = typeKey === 'Adjust' ? (draft.adj === '-' ? 'Adjust (-)' : 'Adjust (+)') : typeKey;
    var body = { action: 'tx', rid: rid(), type: type, at: Date.now(), machine: draft.machine, job: draft.job, remark: draft.remark,
                 items: items.map(function (it) { return { id: it.id, cond: it.cond, pcs: n0(it.pcs), box: n0(it.box) }; }) };
    var qty = 0;
    var entries = items.map(function (it) { var q = n0(it.pcs) + n0(it.box) * pcsBox(it.id); qty += q; return { id: it.id, desc: (byId[it.id] || {}).desc || it.id, qty: q }; });
    queue.push({ rid: body.rid, kind: 'tx', date: todayStr(), hm: hm, body: body,
                 info: { entries: entries, sub: [draft.machine, draft.job].filter(Boolean).join(' · ') } });
    saveQueue();
    var lm = lastMeta();
    if (meta.machine && draft.machine) lm.machine = draft.machine;
    if (typeKey === 'Issue') lm.job = draft.job;
    lsSet(LKEY, lm);
    closeModal(); render();
    var pills = [];
    if (warn) pills.push({ text: '⚠ บันทึกทั้งที่ยอดไม่พอ — ตรวจสต็อกจริง', warn: true });
    showDone(meta.th + (type === 'Adjust (+)' ? ' +' : type === 'Adjust (-)' ? ' −' : ''), hm,
             items.length + ' รายการ · ' + fmtQ(qty) + ' ชิ้น' + (draft.machine ? ' · ' + draft.machine : ''), pills);
    flush();
  }

      '<div class="full"><label class="cap">Description <em>*</em></label><input class="field f-desc" autocomplete="off" placeholder="ชื่อที่หน้างานเข้าใจ เช่น CNMG120408 กลึงหยาบ"></div>' +
      '</div><div class="dyn"></div>' +
      (opt.fromTx ? '' : '<div class="fsec">รับเข้าสต็อกตอนนี้ (ถ้ามี)</div><div class="qty" style="margin-top:10px"><input class="field r-pcs" inputmode="numeric" pattern="[0-9]*" placeholder="0"><span>ชิ้น</span><span class="rbox" hidden><input class="field r-box" inputmode="numeric" pattern="[0-9]*" placeholder="0" style="width:84px"> <span class="rboxl">กล่อง</span></span><span class="eq r-eq"></span></div>') +

      var inp;
      if (SELECT_LIST[k] && lists(SELECT_LIST[k]).length) {

      }
      return '<div' + (full ? ' class="full"' : '') + '><label class="cap" title="' + esc(h) + '">' + esc(h) + '</label>' + inp + '</div>';
    }
    function keep() { $$('[data-k]', dyn).forEach(function (el) { vals[el.dataset.k] = el.value.trim(); }); }
    function build() {
      keep();
      var c = fcat.value, g = guide[c];
      var specKeys = [];
      if (g) g.fields.forEach(function (h) { var k = hk[String(h).toLowerCase()]; if (k && BASIC.indexOf(k) < 0 && STOCKF.indexOf(k) < 0 && SKIP.indexOf(k) < 0) specKeys.push(k); });
      var subs = g && g.sub ? g.sub.split(/\s*,\s*/) : [];
      var html = '<datalist id="subl">' + subs.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
        '<div class="fgrid">' + BASIC.map(field).join('') + '</div>';
      if (c) html += '<div class="fsec">SPEC · ' + esc(c.toUpperCase()) + '</div><div class="fgrid">' + specKeys.map(field).join('') + '</div>';
      html += '<div class="fsec">STOCK</div><div class="fgrid">' + STOCKF.map(field).join('') + field('remark') + '</div>';

        if (!c) { fcat.classList.add('bad'); msg.textContent = 'เลือก Category'; return; }
        if (!desc) { fdesc.classList.add('bad'); msg.textContent = 'กรอก Description'; return; }
        var tool = { id: id, cat: c, desc: desc };
        Object.keys(vals).forEach(function (k) { if (k !== 'id' && vals[k] !== '' && vals[k] != null) tool[k] = vals[k]; });
        var recv = opt.fromTx ? { pcs: 0, box: 0 } : { pcs: n0(wrap.querySelector('.r-pcs').value), box: tool.pcsbox ? n0(wrap.querySelector('.r-box').value) : 0 };

        else showDone('ลงทะเบียนทูลใหม่', hm, desc + (qty ? ' · รับเข้า ' + fmtQ(qty) + ' ชิ้น' : ''), []);

    setTimeout(function () { if (!('ontouchstart' in window)) (fid.value ? fcat : fid).focus(); }, 60);
  }

  /* ================== รายละเอียดทูล (จากการค้นหา / สแกนที่หน้าหลัก) ================== */
  function openTool(t) {
    var s = stockOf(t.id);
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px';
    var chips = [];
    if (specLine(t)) chips.push('<span class="chip"><b>' + esc(specLine(t)) + '</b></span>');
    if (t.brand) chips.push('<span class="chip">' + esc(t.brand) + '</span>');
    if (t.loc) chips.push('<span class="chip">ที่เก็บ <b>' + esc(t.loc) + '</b></span>');
    chips.push('<span class="chip st-' + esc(s.status) + '">' + esc(s.status || '—') + (s.min ? ' · Min ' + fmtQ(s.min) : '') + '</span>');
    if (t.pending) chips.push('<span class="chip st-LOW">⏳ รอส่งถึงระบบ</span>');
    wrap.innerHTML =
      '<div class="stats"><div class="stat main ' + qtyCls(s) + '"><i>รวม</i><b>' + fmtQ(s.tot) + '</b></div><div class="stat"><i>New</i><b>' + fmtQ(s.ohn) + '</b></div>' +
      '<div class="stat"><i>Used/Regrind</i><b>' + fmtQ(s.ohu) + '</b></div><div class="stat"><i>ที่ร้านรีกรายด์</i><b>' + fmtQ(s.atrg) + '</b></div></div>' +
      (s.ohbox ? '<div class="istock">ในกล่อง: <b>' + esc(boxTxt(s.ohbox)) + '</b> (กล่องละ ' + pcsBox(t.id) + ')</div>' : '') +
      '<div class="kv">' + chips.join('') + '</div>' +
      '<div class="actgrid">' + Object.keys(TYPES).map(function (k) { return '<button type="button" class="btn ' + TYPES[k].tone + '" data-t="' + esc(k) + '">' + esc(TYPES[k].th) + '</button>'; }).join('') + '</div>';
    wrap.querySelector('.actgrid').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;

  }

  function openLow() {

    }).join('') + '</div>' : '<div class="empty">ทุกรายการอยู่เหนือ Min Stock ✓</div>';
    wrap.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; closeModal(); openTool(list[Number(b.dataset.i)].t); });

  /* ================== สแกนบาร์โค้ด (กล้องหลัง) ================== */
  var scanner = { on: false, stream: null, reader: null, cb: null };
  function loadScript(src) {
    return new Promise(function (ok, no) {
      var s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = ok; s.onerror = function () { no(new Error('โหลดตัวอ่านบาร์โค้ดไม่ได้ — ตรวจอินเทอร์เน็ต')); };
      document.head.appendChild(s);
    });
  }
  function scanMsg(t, err) { var m = $('#scanMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
  function openScanner(cb) {
    scanner.cb = cb; scanner.on = true;
    $('#scan').hidden = false; $('#scanInput').value = '';
    scanMsg('กำลังเปิดกล้อง…');
    var video = $('#scanVideo');
    function found(code) {
      if (!scanner.on) return;
      code = String(code || '').trim();
      if (!code) return;
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
      var f = scanner.cb; closeScanner(); if (f) f(code);
    }
    function fail(e) {
      if (!scanner.on) return;
      var n = e && e.name;
      scanMsg(n === 'NotAllowedError' ? 'ไม่ได้อนุญาตกล้อง — เปิดที่ ตั้งค่า › Safari › กล้อง หรือพิมพ์รหัสด้านล่าง'
            : n === 'NotFoundError' ? 'ไม่พบกล้อง — พิมพ์ / ยิงบาร์โค้ดด้านล่าง' : errMsg(e), true);
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fail(new Error('อุปกรณ์นี้เปิดกล้องจากเว็บไม่ได้ — พิมพ์ / ยิงบาร์โค้ดด้านล่าง')); return; }
    var constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    if ('BarcodeDetector' in window) {
      navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
        if (!scanner.on) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        scanner.stream = stream; video.srcObject = stream;
        return video.play().then(function () {
          var det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'data_matrix'] });
          scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ');
          (function loop() {
            if (!scanner.on) return;
            det.detect(video).then(function (c) { if (c && c.length) found(c[0].rawValue); else setTimeout(loop, 120); }, function () { setTimeout(loop, 250); });
          })();
        });
      }).catch(fail);
    } else {
      (window.ZXing ? Promise.resolve() : loadScript(ZXING_URL)).then(function () {
        if (!scanner.on) return;
        var Z = window.ZXing, hints = new Map();
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E,
          Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.DATA_MATRIX]);
        hints.set(Z.DecodeHintType.TRY_HARDER, true);
        var reader = new Z.BrowserMultiFormatReader(hints, 120);
        scanner.reader = reader;
        return reader.decodeFromConstraints(constraints, video, function (res) { if (res) found(res.getText()); })
          .then(function () { if (scanner.on) scanMsg('เล็งบาร์โค้ดให้อยู่ในกรอบ'); });
      }).catch(fail);
    }
  }
  function closeScanner() {
    scanner.on = false;
    try { if (scanner.reader) scanner.reader.reset(); } catch (e) {}
    scanner.reader = null;
    if (scanner.stream) { scanner.stream.getTracks().forEach(function (t) { t.stop(); }); scanner.stream = null; }
    var v = $('#scanVideo'); try { v.pause(); } catch (e) {} v.srcObject = null;
    $('#scan').hidden = true;
  }
  $('#scanClose').addEventListener('click', function () { scanner.cb = null; closeScanner(); });
  function manualScan() { var v = $('#scanInput').value.trim(); if (!v) return; var f = scanner.cb; closeScanner(); if (f) f(v); }
  $('#scanOk').addEventListener('click', manualScan);
  $('#scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); manualScan(); } });

  /* ================== ยืนยันบันทึกแล้ว (เขียวเต็มจอ ~2 วินาที) ================== */
  var doneT1 = null, doneT2 = null;
  function showDone(title, time, sub, pills) {
    var el = $('#done');
    $('#doneTitle').textContent = title; $('#doneTime').textContent = time; $('#doneSub').textContent = sub || '';
    $('#donePills').innerHTML = (pills || []).map(function (p) { return '<span class="pill' + (p.warn ? ' warn' : '') + '">' + esc(p.text) + '</span>'; }).join('<br>');
    clearTimeout(doneT1); clearTimeout(doneT2);
    el.classList.remove('hide'); void el.offsetWidth; el.classList.add('show');
    doneT1 = setTimeout(function () { el.classList.add('hide'); doneT2 = setTimeout(function () { el.classList.remove('show', 'hide'); }, 450); }, pills && pills.length ? 2200 : 1450);
  }
  $('#done').addEventListener('click', function () { clearTimeout(doneT1); clearTimeout(doneT2); $('#done').classList.remove('show', 'hide'); });

  /* ================== หน้าหลัก: ค้นหา / สแกน ================== */
  function mainCode(code) {
    $('#qNotFound').innerHTML = '';
    var t = findByCode(code);
    if (t) return openTool(t);
    $('#qNotFound').innerHTML = '<div class="notfound"><span>ไม่พบ <b>' + esc(code) + '</b></span><button type="button" class="btn">ลงทะเบียนทูลใหม่</button></div>';
    $('#qNotFound button').addEventListener('click', function () { $('#qNotFound').innerHTML = ''; openRegister(code); });
  }
  var mainSug = toolSuggest($('#q'), $('#qSugg'), function (t) { $('#qNotFound').innerHTML = ''; $('#q').blur(); openTool(t); });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var v = $('#q').value.trim(); if (!v) return;
    var t = findByCode(v) || (searchTools(v, 2).length === 1 ? searchTools(v, 1)[0] : null);
    $('#q').value = ''; mainSug.hide(); $('#q').blur();
    if (t) openTool(t); else mainCode(v);
  });
  $('#q').addEventListener('input', function () { $('#qNotFound').innerHTML = ''; });
  $('#qScan').addEventListener('click', function () { openScanner(mainCode); });

  /* ================== wiring ================== */
  $$('#grid .tile').forEach(function (el) {
    el.addEventListener('click', function () {
      if (!cat) { toast('กำลังโหลดข้อมูลทูล…', 'warn'); return; }
      if (el.dataset.type === 'New') openRegister('');
      else openTx(el.dataset.type);
    });
  });
  $('#rlist').addEventListener('click', function (e) { var r = e.target.closest('.ritem'); if (r && byId[r.dataset.id]) openTool(byId[r.dataset.id]); });
  $('#status').addEventListener('click', function () { if (cat) openLow(); });
  $('#sync').addEventListener('click', function () {
    var p = Object.keys(perf).map(function (k) { return k + ' ' + (perf[k].ms >= 1000 ? (perf[k].ms / 1000).toFixed(1) + ' s' : perf[k].ms + ' ms'); }).join(' · ');
    toast((queue.length ? 'รอส่ง ' + queue.length + ' รายการ · ' : 'ซิงค์แล้ว · ') + (p || 'ยังไม่ได้เชื่อมต่อ'));
  });
  $('#refresh').addEventListener('click', function () { refresh(true); flush(); });
  $('#logout').addEventListener('click', function () {
    var msg = queue.length ? 'ยังมี ' + queue.length + ' รายการที่ยังส่งไม่ถึงระบบ — จะส่งให้อัตโนมัติเมื่อเข้าสู่ระบบครั้งถัดไป\nออกจากระบบ?' : 'ออกจากระบบ?';
    if (window.confirm(msg)) logout();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (scanner.on) { scanner.cb = null; closeScanner(); } return; }
    if (!session) return;
    flush();
    if (!$('#modal').classList.contains('show')) refresh();
  });
  window.addEventListener('online', function () { flush(); });
  setInterval(function () { if (queue.length && !flushing) flush(); }, 15000);

  tick(); setInterval(tick, 1000);
  if (!apiUrl()) showLogin('ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ index.html');
  else if (session) { showApp(); startSession(); }
  else showLogin();
</script>
</body>
</html>
